[package]
name = "player-notch"
version = "2.0.0"
edition = "2024"
description = "Windows media controls in a floating Dynamic Island"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "NotchPlayer"
path = "src/main.rs"
